<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameMatch – Clickable Prototype</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f3;--card:#fff;--ink:#15201a;--mut:#5f6d65;--acc:#1b9a52;--on:#fff;--soft:#e6f5ec;--line:#dde4df;color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--ink:#e9f1ec;--mut:#98a79d;--acc:#38c777;--on:#06140c;--soft:#1b3326;--line:#2a372f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--ink:#e9f1ec;--mut:#98a79d;--acc:#38c777;--on:#06140c;--soft:#1b3326;--line:#2a372f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{font-size:18px}.sp{flex:1}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{margin:8px 0}.m{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--ink)}
.pc:hover{border-color:var(--acc)}.pc .e{font-size:30px}.pc b{display:block;font-size:18px;margin-top:6px}.pc small{color:var(--mut)}.pc p{margin:8px 0 12px}.go{color:var(--acc);font-weight:600}
.jr{display:grid;grid-template-columns:200px 360px 1fr;gap:22px;align-items:start}
.steps{display:flex;flex-direction:column;gap:6px}
.st{background:none;border:0;text-align:left;color:var(--mut);padding:7px 9px;border-radius:8px;display:flex;gap:8px}
.st i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.st.on{background:var(--soft);color:var(--ink)}.st.on i,.st.dn i{background:var(--acc);color:var(--on);border-color:var(--acc)}
.phone{width:340px;margin:0 auto;border:8px solid #1c2620;border-radius:34px;background:var(--card);overflow:hidden}
.scr{height:600px;overflow-y:auto;padding:18px 16px}
.scr{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}.bk{background:none;border:0;color:var(--mut);padding:0 0 6px}.scr h3{margin:4px 0}.scr label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.in,.scr input,.scr select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.otp{display:flex;gap:6px}.otp span{flex:1;text-align:center;padding:10px 0;border:1px solid var(--acc);border-radius:8px;font-weight:700}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:20px;margin:3px 4px 3px 0;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.chip.blk{background:#c0392b;color:#fff;border-color:#c0392b}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.card.tap{cursor:pointer}.card.tap:hover{border-color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pb{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:700}
.pb.s{background:none;border:1px solid var(--line);color:var(--ink);margin-top:8px}
.pb[disabled]{opacity:.7}
.tag{display:inline-block;background:var(--soft);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.warn{background:#fdecea;color:#a5281b;border-radius:10px;padding:10px;font-size:14px}
.ok{background:var(--soft);border-radius:10px;padding:10px;font-size:14px}
.av{display:inline-block;width:26px;height:26px;border-radius:50%;margin-right:-6px;border:2px solid var(--card)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
.bad{outline:2px solid #c0392b;outline-offset:1px;border-radius:10px}.err{color:#c0392b;font-size:12px;margin:4px 0 0}.big{font-size:44px;text-align:center;margin-top:30px}.c{text-align:center}
.stp{display:flex;align-items:center;gap:10px}.stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px}
.star{font-size:30px;cursor:pointer;color:var(--line)}.star.on{color:#f0b429}
.ph1{height:90px;border-radius:10px;background:linear-gradient(135deg,var(--soft),var(--line));display:grid;place-items:center;font-size:30px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--mut)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp div{border:1px solid var(--line);border-radius:10px;padding:10px}.kp b{font-size:20px;display:block}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0}
.toast{background:var(--acc);color:var(--on);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px;animation:d .4s}
@keyframes d{from{transform:translateY(-12px);opacity:0}}
.notes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.notes h4{margin:0 0 10px}.notes p{margin:2px 0 12px}.notes b{font-size:12px;color:var(--acc);text-transform:uppercase}
.gl{background:var(--soft);border-radius:10px;padding:10px;font-size:14px}
@media(max-width:940px){.jr{grid-template-columns:1fr}.steps{flex-direction:row;flex-wrap:wrap}.st span{display:none}.st.on span{display:inline}}
</style></head><body>
<header><b class="logo">⚽ GameMatch</b><span class="m">Clickable prototype</span><span class="sp"></span><button class="ghost" data-home>All personas</button></header>
<main id="app"></main>
<script>
const T=new Date().toISOString().slice(0,10);
const ch=(a,on=0,k='pick')=>a.map((x,j)=>`<span class="chip${j==on?' on':''}" data-${k}>${x}</span>`).join('');
const nb=(t,k='n')=>`<button class="pb" data-${k}>${t}</button>`;
const sel=a=>`<select data-req="sel"><option value="">Select…</option>${a.map(x=>`<option>${x}</option>`).join('')}</select>`;
const av=['#e76f51','#2a9d8f','#e9c46a','#457b9d','#9b5de5','#f4a261'];
const avs=n=>av.slice(0,n).map(c=>`<span class="av" style="background:${c}"></span>`).join('');
let P=null,i=0,S={},W=0;const O=['karim','nour','hassan','salma'];
const J={
karim:{n:'Karim',r:'Solo player',e:'🏃',g:'Find and join a game tonight without organizing anything.',d:'Karim is in tonight’s game, has paid his share and has rated the court. He found a game without knowing a single other player.',s:[
{t:'Sign up',i:'Mobile number',o:'OTP request confirmation',u:'Matching expected input (numeric keypad, one field only)',h:()=>`<h3>Welcome to GameMatch</h3><p class="m">Find a game and a court in minutes.</p><label>Mobile number</label><input id="ph" data-req="tel" placeholder="0100 000 0000" inputmode="tel">${nb('Send OTP')}`},
{t:'Verify OTP',i:'6-digit code (auto-filled)',o:'Inline validation, then profile screen',u:'Minimal user action: auto-fill and validation',h:()=>`<h3>Enter the code</h3><p class="m">We sent a 6-digit code by SMS.</p><input id="otp" data-req="otp" placeholder="6-digit code" inputmode="numeric" maxlength="6" style="text-align:center;letter-spacing:6px;font-size:20px"><p class="m">The code is filled in automatically when the SMS arrives. Resend in 60s.</p>${nb('Verify')}`},
{t:'Profile',i:'Sport, skill level, area (chips, radio, drop-down)',o:'"Profile ready" message',u:'Radio buttons vs. check boxes, default values',h:()=>`<h3>Your profile</h3><label>Sports you play</label><div data-req="grp">${ch(['Football','Padel','Basketball','Tennis'],-1,'chip')}</div><label>Skill level</label><div data-req="grp">${ch(['Beginner','Intermediate','Advanced'],-1)}</div><label>Area</label>${sel(['Maadi','Nasr City','Zamalek','New Cairo','Sheikh Zayed'])}${nb('Continue')}`},
{t:'Browse games',i:'Filters: sport, date, time range, area, skill, price',o:'List of open games with spots left',u:'Group related data, clear titles',h:()=>`<h3>Open games</h3><div>${['Football','Today','18:00–22:00','Intermediate'].map(x=>`<span class="chip on" style="cursor:default">${x}</span>`).join('')}</div>
<div class="card tap" data-n><div class="row"><b>5-a-side · Today 20:00</b><span class="tag">4 spots left</span></div><div class="m">Green Arena, Pitch 2 · Intermediate</div><b>EGP 60</b> per player</div>
<div class="card tap" data-n><div class="row"><b>7-a-side · Today 21:30</b><span class="tag">2 spots left</span></div><div class="m">Sky Pitch · Intermediate</div><b>EGP 40</b> per player</div>
<div class="card tap" data-n><div class="row"><b>5-a-side · Tomorrow 19:00</b><span class="tag">6 spots left</span></div><div class="m">Club 90 · Beginner</div><b>EGP 70</b> per player</div>`},
{t:'Game details',i:'Tap a game',o:'Court, time, price, joined players, ratings',u:'Right information at the right time',h:()=>`<h3>5-a-side · Today 20:00</h3><p class="m">Green Arena, Pitch 2 · 20:00–21:00</p><div class="card"><div class="row"><span>${avs(6)}</span><b>6 of 10 joined</b></div><div class="bar"><i style="width:60%"></i></div><p class="m">Host rating ★ 4.8 · Intermediate level</p></div><div class="ok">Free cancellation until 4 hours before the game.</div><div class="row" style="margin-top:12px"><b>EGP 60</b><span class="m">per player</span></div>${nb('Join game')}`},
{t:'Join and pay',i:'Payment method',o:'Progress bar, then receipt',u:'Proper feedback: progress bars',h:()=>`<h3>Confirm and pay</h3><div class="card"><div class="row"><span>Your share</span><b>EGP 60</b></div><div class="row"><span>Service fee</span><b>EGP 5</b></div></div><label>Payment method</label><div data-req="grp">${ch(['Card','Mobile wallet'],-1)}</div><p class="m">Payment is handled by our payment partner. We never store card details.</p><button class="pb" data-pay>Pay EGP 65</button>`},
{t:'You’re in!',i:'None',o:'Confirmation and a reminder 2 hours before the game',u:'Acknowledge process completion',h:()=>`<div class="big">✅</div><h3 class="c">You’re in!</h3><p class="c m">Green Arena, Pitch 2 · Today 20:00</p><div class="ok">🔔 We’ll remind you 2 hours before. If the game is cancelled you are refunded automatically.</div>${nb('After the game →')}`},
{t:'Rate',i:'Stars, optional comment',o:'Thank-you message and journey outcome',u:'Optional fields kept optional',h:()=>`<h3>How was the game?</h3><p class="m">Rate the court</p><div>${[1,2,3,4,5].map(n=>`<span class="star${n<=S.st?' on':''}" data-star="${n}">★</span>`).join('')}</div><label>Comment (optional)</label><input placeholder="Great pitch, friendly players"><p class="warn" id="re" style="display:none;margin-top:10px">Please choose a star rating first.</p><button class="pb" data-rate>Submit</button>`}]},
nour:{n:'Nour',r:'Team player',e:'📋',g:'Book a court and fill the missing spots in one flow.',d:'Nour booked the court, invited her friends and knows exactly what happens if the game does not fill. No phone calls, no chasing money.',s:[
{t:'Search courts',i:'Sport, date, time range, area',o:'Search results',u:'Calendar navigation: date picker blocks past dates',h:()=>`<h3>Find a court</h3><label>Sport</label>${sel(['Football','Padel','Basketball'])}<label>Date</label><input type="date" min="${T}" data-req="date"><label>Time range</label>${sel(['18:00–22:00','16:00–18:00','22:00–24:00'])}<label>Area</label>${sel(['Maadi','Nasr City','Zamalek','New Cairo'])}${nb('Search')}`},
{t:'Results',i:'Tap a court',o:'Courts with price, rating, free slots',u:'Clear titles, minimal abbreviations',h:()=>`<h3>3 courts available</h3>${[['Green Arena','EGP 600/hr','★ 4.7','3 free slots'],['Sky Pitch','EGP 550/hr','★ 4.4','2 free slots'],['Club 90','EGP 700/hr','★ 4.9','1 free slot']].map(c=>`<div class="card tap" data-n><div class="row"><b>${c[0]}</b><span class="tag">${c[3]}</span></div><div class="m">${c[1]} · ${c[2]}</div></div>`).join('')}<p class="m">Sorted by distance.</p>`},
{t:'Pick a slot',i:'Select a time slot',o:'Court details, slot hold message',u:'Right information at the right time',h:()=>`<h3>Green Arena</h3><p class="m">Street 9, Maadi · ★ 4.7 · EGP 600 per hour</p><label>Available slots</label><div data-req="grp">${ch(['19:00','20:00','21:00'],-1)}</div><div class="ok">🔒 The slot you select is held for 10 minutes while you create your game and pay.</div>${nb('Continue')}`},
{t:'Create game',i:'Players needed, skill, public or private',o:'Cost per player auto-calculated',u:'Reducing the need to input: auto-calculation',h:()=>`<h3>Create your game</h3><label>Players needed</label><div class="stp"><button data-pl="-1">−</button><b id="plv">${S.pl}</b><button data-pl="1">+</button></div><label>Skill level</label><div data-req="grp">${ch(['Beginner','Intermediate','Advanced'],-1)}</div><label>Visibility</label><div data-req="grp">${ch(['Public','Private (invite only)'],-1)}</div><div class="card"><div class="row"><span>Court (1 hour)</span><b>EGP 600</b></div><div class="row"><span>Per player</span><b id="plc">EGP ${Math.ceil(600/S.pl)}</b></div></div><p class="m">You pay your own share now to secure the slot. The other players’ shares are collected as they join.</p><button class="pb" data-pay>Pay my share and create game</button>`},
{t:'Invite friends',i:'Share link or leave public',o:'Live counter of joined players',u:'Clear user feedback',h:()=>`<div class="big" style="margin-top:6px">🎉</div><h3 class="c">Game created</h3><div class="card"><div class="row"><b>${Math.min(6,S.pl)} of ${S.pl} joined</b><span>${avs(5)}</span></div><div class="bar"><i style="width:${Math.min(6,S.pl)/S.pl*100}%"></i></div></div><div class="card row"><span class="m">gamematch.app/g/x7Kq</span><button class="ghost" data-copy>Copy</button></div><div id="cw"><p class="m">The cutoff is 4 hours before kick-off. We will alert you if the game is not full.</p><button class="pb" disabled>Waiting for the cutoff time…</button></div>`},
{t:'Cutoff decision',i:'Cancel and refund, or open to the public',o:'Alert that the game is not full, with both options',u:'Acknowledge acceptance or rejection',h:()=>`<div class="warn">⚠️ Only ${Math.min(6,S.pl)} of ${S.pl} players joined and the cutoff has passed.</div><p>What would you like to do?</p><button class="pb" data-cut="refund">Cancel and refund everyone</button><button class="pb s" data-cut="open">Open the game to the public</button><p class="m">If you cancel, every player is refunded in full.</p>`},
{get t(){return S.cut=='open'?'Confirm listing':'Confirm refund'},get i(){return S.cut=='open'?'Confirm':'Reason for cancelling (required), then confirm'},get o(){return S.cut=='open'?'How the public game works':'Refund summary: who is refunded, how much and where to'},u:'Confirm before an action that cannot be undone',h:()=>S.cut=='open'?`<h3>Open to the public?</h3><div class="card">Your game will be listed in Browse games with ${S.pl-Math.min(6,S.pl)} spots left.</div><div class="ok">Players can join until 2 hours before kick-off. If the game is still not full by then, it is cancelled and everyone is refunded.</div>${nb('Confirm and publish game')}`:`<h3>Cancel and refund everyone?</h3><div class="card"><div class="row"><span>Players to refund</span><b>${Math.min(6,S.pl)}</b></div><div class="row"><span>Each player gets back</span><b>EGP ${Math.ceil(600/S.pl)+5}</b></div><div class="row"><span>Total refunded</span><b>EGP ${Math.min(6,S.pl)*(Math.ceil(600/S.pl)+5)}</b></div></div><p class="m">The money goes back to each player’s original payment method. The slot is released and the court owner is notified.</p><label>Reason for cancelling</label>${sel(['Not enough players','Players dropped out','Court no longer needed'])}${nb('Confirm cancellation and refund')}`},
{get t(){return S.cut=='open'?'Game is public':'Refund status'},i:'None',get o(){return S.cut=='open'?'The game is listed with its spots left':'Refund steps and the status of each refund'},u:'Acknowledge completion and show the status',h:()=>S.cut=='open'?`<div class="big" style="margin-top:6px">📣</div><h3 class="c">Your game is public</h3><div class="card"><div class="row"><b>${Math.min(6,S.pl)} of ${S.pl} joined</b><span class="tag">${S.pl-Math.min(6,S.pl)} spots left</span></div><div class="bar"><i style="width:${Math.min(6,S.pl)/S.pl*100}%"></i></div></div><div class="ok">It now appears in Browse games. Everyone who joined has been notified.</div>${nb('Finish')}`:`<div class="big" style="margin-top:6px">↩️</div><h3 class="c">Game cancelled</h3><div class="card"><b>Refund steps</b><br>✓ Game cancelled<br>✓ Slot released and court owner notified<br>✓ Refunds requested for ${Math.min(6,S.pl)} players<br>⏳ Money returns to the original payment method (3–5 working days)<br>✓ Every player notified</div><div class="card"><div class="row"><span>Your refund</span><b>EGP ${Math.ceil(600/S.pl)+5}</b></div><div class="row"><span>Status</span><span class="tag">Processing</span></div></div>${nb('Finish')}`}]},

{t:'Add a court',i:'Name, sport, base price per hour, location (typed address)',o:'Listing preview, "pending" status',u:'Group related fields, mandatory vs. optional',h:()=>`<h3>Add your court</h3><label>Court name *</label><input id="cn" data-req="name" placeholder="e.g. Pitch 1">${'<label>Sport *</label>'+sel(['Football','Padel','Basketball'])}<label>Price per hour (EGP) *</label><input id="bp" data-req="num" placeholder="e.g. 500" inputmode="numeric"><label>Location *</label><input id="lc" data-req="loc" placeholder="Street, area, city">${nb('Submit for approval')}`},
{t:'Pending approval',i:'None',o:'Status and checklist, then a notification when the court is approved',u:'Clear feedback on process status',h:()=>`<h3>${S.f_cn||'Pitch 1'}</h3><div id="wa"><span class="tag">Pending approval</span><div class="card">✓ Details complete<br>✓ Location added<br>⏳ Admin review (usually under 24h)</div><p class="m">You will be notified when your court goes live.</p><button class="pb" disabled>Waiting for approval…</button></div>`},
{t:'Availability and prices',i:'Opening days, peak and off-peak prices',o:'Weekly schedule summary',u:'Sensible defaults, calendar controls',h:()=>`<h3>Availability</h3><div class="ok">🎉 ${S.f_cn||'Pitch 1'} is approved.</div><label>Open days</label><div data-req="grp">${ch(['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],-1,'chip')}</div><label>Prices (EGP per hour)</label><label>Off-peak 09:00–17:00</label><input id="off" data-req="num" placeholder="e.g. 400" inputmode="numeric"><label>Peak 17:00–23:00</label><input data-req="peak" placeholder="e.g. 600" inputmode="numeric">${nb('Save schedule')}`},
{t:'Manage bookings',i:'Tap a free slot to block it',o:'New booking notification, day calendar',u:'Notifications and clear status',h:()=>`<div class="toast">🔔 New booking: Today 20:00 · 8 players · EGP 500</div><h3>Today</h3>${[['18:00','Booked','tag'],['19:00','Free',''],['20:00','Booked · new','tag'],['21:00','Free','']].map(r=>`<div class="card row"><b>${r[0]}</b>${r[2]?`<span class="tag">${r[1]}</span>`:`<span class="chip" data-chip style="margin:0">${r[1]} – tap to block</span>`}</div>`).join('')}${nb('Done')}`}]},

{t:'Review courts',i:'Approve or reject (with reason)',o:'Owner is notified',u:'Proper feedback on every decision',h:()=>`<h3>Pending courts (2)</h3>${[['Pitch 1','Hassan’s Sports Center'],['Padel Court B','City Padel Club']].map(c=>`<div class="card"><b>${c[0]}</b><div class="m">${c[1]}</div><div style="margin-top:8px"><button class="ghost" data-mark="Approved ✓">Approve</button> <button class="ghost" data-rej>Reject</button></div></div>`).join('')}${nb('Next: complaints')}`},

{t:'Dashboard',i:'Date range (last 7, 30 or 90 days)',o:'KPIs and a bookings chart for the chosen range',u:'Output meaningful to the user',h:()=>`<h3>Dashboard</h3><div>${Object.keys(RG).map(x=>`<span class="chip${x==R()?' on':''}" data-rng="${x}">${x}</span>`).join('')}</div>${(k=>`<div class="kp"><div><b>${k[0].toLocaleString('en-US')}</b>Bookings</div><div><b>${k[1]}%</b>Fill rate</div><div><b>EGP ${k[2]}</b>Revenue</div><div><b>${k[3]}%</b>Cancellations</div></div><label>Bookings over the period</label><div class="bars">${k[4].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`)(RG[R()])}${nb('Finish')}`}]}};
const cl=t=>{const g=t.parentElement;g.classList.remove('bad');const n=g.nextElementSibling;if(n&&n.classList.contains('err'))n.remove()};
document.addEventListener('input',e=>{const t=e.target,n=t.nextElementSibling;t.classList.remove('bad');if(n&&n.classList.contains('err'))n.remove()});
function val(sc){sc=sc||document.querySelector('.scr');let ok=true;sc.querySelectorAll('.err').forEach(x=>x.remove());sc.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));sc.querySelectorAll('[data-req]').forEach(e=>{const t=e.dataset.req;let m='';if(e.matches('input,select')){const v=e.value.trim(),n=+v;if(!v)m=t=='sel'?'Please choose an option.':'This field is required.';else if(t=='tel'&&!/^01[0125]\d{8}$/.test(v.replace(/\s/g,'')))m='Enter a valid 11-digit mobile number, e.g. 0100 000 0000.';else if(t=='otp'&&!/^\d{6}$/.test(v))m='The code must be exactly 6 digits.';else if(t=='num'&&!(n>0))m='Enter a price greater than 0.';else if(t=='peak'&&!(n>=+document.getElementById('off').value))m='Peak price can’t be lower than the off-peak price.';else if(t=='name'&&v.length<3)m='The name must be at least 3 characters.';else if(t=='loc'&&!(v.length>=8&&/\S\s+\S/.test(v)&&/[A-Za-z\u0600-\u06FF]/.test(v)))m='Enter a full address (street, area, city).';else if(t=='date'&&v<T)m='Choose today or a future date.';else if(t=='reason'&&v.length<5)m='Please give a short reason (at least 5 characters).'}else if(!e.querySelector('.on'))m='Please choose an option.';if(m){ok=false;e.classList.add('bad');e.insertAdjacentHTML('afterend','<p class="err">'+m+'</p>')}});if(ok&&sc.matches('.scr')&&sc.querySelector('.ghost[data-mark],.ghost[data-conf]')){ok=false;sc.insertAdjacentHTML('beforeend','<p class="err">Please decide on every item before continuing.</p>')}if(ok)sc.querySelectorAll('input[id]').forEach(e=>{S['f_'+e.id]=e.value.replace(/[<>&]/g,'')});else{const b=sc.querySelector('.bad,.err');if(b)b.scrollIntoView({block:'center'})}return ok}
const RG={'Last 7 days':[291,70,'43k',7,[50,70,60,85,75,90,80]],'Last 30 days':[1248,72,'186k',6,[45,60,72,90]],'Last 90 days':[3610,69,'540k',8,[40,55,65,80,70,90]]};const R=()=>S.rg||'Last 30 days';
function home(){return `<h1>Pick a persona</h1><p class="m">Each persona has a clickable journey. Click the buttons and cards inside the phone, just like a real user would. Best order: Karim, Nour, Hassan, Salma. Every journey ends with an outcome screen and a link to the next persona.</p><div class="grid">${Object.entries(J).map(([k,p])=>`<button class="pc" data-p="${k}"><span class="e">${p.e}</span><b>${p.n}</b><small>${p.r}</small><p>${p.g}</p><span class="go">Start journey →</span></button>`).join('')}</div>`}
function journey(){const p=J[P],n=p.s.length,d=i>=n,nx=O[O.indexOf(P)+1],s=p.s[Math.min(i,n-1)];
const scr=d?`<div class="big">🎉</div><h3 class="c">${p.n}’s user journey ends</h3><p class="c">${p.d}</p><div class="ok">All ${n} steps completed.</div>${nx?`<button class="pb" data-p="${nx}">Next: meet ${J[nx].n} →</button>`:''}${nb('Replay this journey','again').replace('pb','pb s')}<button class="pb s" data-home>All personas</button>`:(i>0?'<button class="bk" data-b>‹ Back</button>':'')+s.h();
return `<div class="jr"><div class="steps">${p.s.map((x,j)=>`<button class="st${j==i?' on':''}${j<i?' dn':''}" data-go="${j}"><i>${j+1}</i><span>${x.t}</span></button>`).join('')}</div>
<div class="phone"><div class="scr">${scr}</div></div>
<div class="notes"><h4>${p.e} ${p.n} · ${p.r}</h4>${d?`<p>All ${n} steps completed. Use the list on the left to jump to any step, or move on to the next persona.</p><div class="gl">Problem solved: ${p.g}</div>`:`<b>Step ${i+1} of ${n}: ${s.t}</b><p></p><b>Input</b><p>${s.i}</p><b>Output</b><p>${s.o}</p><div class="gl">Design principle: ${s.u}</div>`}</div></div>`}
function render(){document.getElementById('app').innerHTML=P?journey():home();if(P=='hassan'&&i==1){const k=++W;setTimeout(()=>{const w=document.getElementById('wa');if(w&&k==W&&P=='hassan'&&i==1)w.innerHTML='<div class="toast">🎉 '+(S.f_cn||'Pitch 1')+' was approved and is now visible to players.</div><span class="tag">Approved</span><div class="card">✓ Details complete<br>✓ Location added<br>✓ Admin review done</div><button class="pb" data-n>Set availability and prices</button>'},2200)}else if(P=='karim'&&i==1){const k=++W;setTimeout(()=>{const o=document.getElementById('otp');if(o&&k==W&&P=='karim'&&i==1&&!o.value)o.value='482915'},1500)}else if(P=='nour'&&i==4){const k=++W;setTimeout(()=>{const w=document.getElementById('cw');if(w&&k==W&&P=='nour'&&i==4)w.innerHTML='<div class="toast">⏰ Cutoff reached: only '+Math.min(6,S.pl)+' of '+S.pl+' players joined.</div><button class="pb" data-n>Review my options</button>'},3000)}else W++}
function start(k){P=k;i=0;S={pl:10,st:0};render();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-n],[data-b],[data-go],[data-pick],[data-chip],[data-pl],[data-star],[data-rate],[data-pay],[data-cut],[data-rng],[data-rej],[data-conf],[data-mark],[data-copy],[data-p],[data-home],[data-again]');if(!t)return;const d=t.dataset;
if('p' in d)return start(d.p);
if('home' in d){P=null;return render()}
if('again' in d)return start(P);
if('go' in d){i=+d.go;return render()}
if('n' in d){if(!val())return;i++;return render()}
if('b' in d){i=Math.max(0,i-1);return render()}
if('pl' in d){S.pl=Math.min(22,Math.max(4,S.pl+ +d.pl));document.getElementById('plv').textContent=S.pl;document.getElementById('plc').textContent='EGP '+Math.ceil(600/S.pl);return}
if('star' in d){S.st=+d.star;return render()}if('rate' in d){if(!S.st){document.getElementById('re').style.display='block';return}i++;return render()}
if('pay' in d){if(!val())return;t.disabled=true;t.innerHTML='Processing… <div class="bar"><i style="width:70%"></i></div>';return void setTimeout(()=>{i++;render()},900)}
if('cut' in d){S.cut=d.cut;i++;return render()}
if('rng' in d){S.rg=d.rng;return render()}
if('rej' in d){t.parentElement.innerHTML='<input data-req="reason" placeholder="Reason for rejection (required)" style="margin-bottom:6px"><button class="ghost" data-conf>Confirm rejection</button>';return}
if('conf' in d){if(!val(t.parentElement))return;t.parentElement.innerHTML='<span class="tag">Rejected ✗</span>';return}
if('mark' in d){t.parentElement.innerHTML=`<span class="tag">${d.mark}</span>`;return}
if('copy' in d){t.textContent='Copied ✓';return}
if('chip' in d){t.classList.toggle(t.textContent.includes('block')?'blk':'on');cl(t);return}
if('pick' in d){[...t.parentElement.children].forEach(x=>x.classList.remove('on'));t.classList.add('on');cl(t)}
});
render();
</script></body></html>
